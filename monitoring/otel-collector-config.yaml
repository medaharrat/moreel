receivers:
  otlp:
    protocols:
      # Explicit 0.0.0.0 — this version's default binds to loopback only,
      # which is unreachable from the `app` container even on the same
      # docker network.
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, otlp_grpc/jaeger]
    metrics:
      receivers: [otlp]
      exporters: [debug]
