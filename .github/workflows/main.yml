name: Build, scan, and deploy

on:
  push:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-scan:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed yet — scan first)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: moreel:${{ steps.meta.outputs.tag }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: moreel:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable, versioned image
        run: |
          docker tag moreel:${{ steps.meta.outputs.tag }} ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
          docker push ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}

  deploy-staging:
    needs: build-and-scan
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to staging
        run: flyctl deploy --config fly.staging.toml --image ghcr.io/${{ github.repository }}:${{ needs.build-and-scan.outputs.image-tag }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test
        run: |
          curl -sf --retry 5 --retry-delay 5 "${{ vars.STAGING_URL }}/health"
          curl -sf --retry 5 --retry-delay 5 "${{ vars.STAGING_URL }}/ready"

  deploy-production:
    needs: [build-and-scan, deploy-staging]
    runs-on: ubuntu-latest
    # Requires a reviewer on the "production" GitHub Environment — this is
    # the explicit promotion gate; nothing reaches production automatically.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to production
        run: flyctl deploy --config fly.toml --image ghcr.io/${{ github.repository }}:${{ needs.build-and-scan.outputs.image-tag }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test
        run: |
          curl -sf --retry 5 --retry-delay 5 "${{ vars.PRODUCTION_URL }}/health"
          curl -sf --retry 5 --retry-delay 5 "${{ vars.PRODUCTION_URL }}/ready"
